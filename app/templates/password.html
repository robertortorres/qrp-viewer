{% extends "base.html" %}
{% block title %}Alterar senha · {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="pagehead"><h1>Alterar senha</h1></div>
{% if user.must_change_password %}<p class="lede">Por segurança, defina uma senha só sua antes de continuar.</p>{% endif %}
{% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" class="stack narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <input type="hidden" name="username" value="{{ user.username }}" autocomplete="username">
  <label>Senha atual
    <input name="current" type="password" autocomplete="current-password" required>
  </label>
  <label>Nova senha
    <input name="new" type="password" autocomplete="new-password" minlength="8" required>
    <span class="hint">Pelo menos 8 caracteres.</span>
  </label>
  <label>Confirme a nova senha
    <input name="confirm" type="password" autocomplete="new-password" minlength="8" required>
  </label>
  <div class="actions"><button class="btn btn-primary" type="submit">Alterar senha</button></div>
</form>
{% endblock %}
