<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- O laudo Eyetec usa Tahoma; Inter é a substituta mais fiel disponível no Debian. -->
<fontconfig>
  <alias binding="same">
    <family>Tahoma</family>
    <prefer><family>Inter</family><family>DejaVu Sans</family></prefer>
  </alias>
</fontconfig>
